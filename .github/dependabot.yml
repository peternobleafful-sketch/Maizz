# Weekly checks for out-of-date or vulnerable packages. Each one arrives as a pull request that the tests check.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Big version jumps (for example TypeScript 5 to 7) break the build and need a proper look.
    # Security fixes still arrive, because those are separate alerts.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
